name: Implement notification cursor pagination

on:
  push:
    branches:
      - feature/notifications-cursor-pagination

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Backend: replace only the notifications route between stable comments.
          p = Path('server/index.js')
          s = p.read_text()
          start_marker = "// Get Notifications (auto-migrates old friendRequests)"
          end_marker = "// Mark all notifications as read"
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          route = r'''// Get Notifications with cursor-based pagination (auto-migrates old friendRequests)
          app.get('/api/users/notifications', authenticateToken, async (req, res) => {
            try {
              const limit = Math.min(Math.max(parseInt(req.query.limit, 10) || 20, 1), 50);
              const cursor = req.query.cursor || null;

              const formatNotifications = (notifications) => notifications.map(notification => {
                const item = notification.toObject ? notification.toObject() : notification;
                const requestUser = item.user;
                const followBackRequested = Boolean(
                  requestUser?.friendRequests?.some(id => id.toString() === req.user.userId)
                );
                if (requestUser) delete requestUser.friendRequests;
                return { ...item, followBackRequested };
              });

              let user = await User.findById(req.user.userId).populate('notifications.user', 'username uniqueId avatarUrl friendRequests');
              if (!user) return res.status(404).json({ message: 'User not found' });

              let migrated = false;
              for (const reqId of (user.friendRequests || [])) {
                const exists = user.notifications.some(n => n.user && n.user._id && n.user._id.toString() === reqId.toString());
                if (!exists) {
                  user.notifications.push({ type: 'follow_request', user: reqId, createdAt: new Date(Date.now() - 10000) });
                  migrated = true;
                }
              }

              if (migrated) {
                await user.save();
                user = await User.findById(req.user.userId).populate('notifications.user', 'username uniqueId avatarUrl friendRequests');
              }

              let sorted = [...user.notifications].sort((a, b) => {
                const time = new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
                return time || String(b._id).localeCompare(String(a._id));
              });

              if (cursor) {
                let decoded;
                try {
                  decoded = JSON.parse(Buffer.from(cursor, 'base64url').toString('utf8'));
                } catch (e) {
                  return res.status(400).json({ message: 'Invalid notification cursor' });
                }
                const cursorTime = new Date(decoded.createdAt).getTime();
                const cursorId = String(decoded.id || '');
                if (!Number.isFinite(cursorTime) || !cursorId) {
                  return res.status(400).json({ message: 'Invalid notification cursor' });
                }
                sorted = sorted.filter(n => {
                  const itemTime = new Date(n.createdAt).getTime();
                  const itemId = String(n._id);
                  return itemTime < cursorTime || (itemTime === cursorTime && itemId < cursorId);
                });
              }

              const page = sorted.slice(0, limit);
              const last = page[page.length - 1];
              const nextCursor = page.length === limit && last
                ? Buffer.from(JSON.stringify({ createdAt: last.createdAt, id: String(last._id) })).toString('base64url')
                : null;

              res.json({ notifications: formatNotifications(page), nextCursor });
            } catch (error) {
              console.error(error);
              res.status(500).json({ message: 'Error fetching notifications' });
            }
          });

          '''
          s = s[:start] + route + s[end:]
          p.write_text(s)

          # Frontend: state + paginated fetch.
          p = Path('client/src/components/Dashboard.jsx')
          s = p.read_text()
          state = "  const [notifications, setNotifications] = useState([]);"
          if "const [notificationsCursor" not in s:
              s = s.replace(state, state + "\n  const [notificationsCursor, setNotificationsCursor] = useState(null);\n  const [notificationsLoading, setNotificationsLoading] = useState(false);", 1)

          start = s.index('  const fetchNotifications = async () => {')
          end = s.index('\n  };', start) + len('\n  };')
          fn = r'''  const fetchNotifications = async ({ cursor = null, append = false } = {}) => {
            if (notificationsLoading) return;
            setNotificationsLoading(true);
            try {
              const params = new URLSearchParams({ limit: '20' });
              if (cursor) params.set('cursor', cursor);
              const res = await fetch(`${API_URL}/api/users/notifications?${params.toString()}`, { headers: { Authorization: `Bearer ${token}` } });
              const data = await res.json();
              if (res.ok) {
                const page = Array.isArray(data.notifications) ? data.notifications : [];
                setNotifications(prev => append ? [...prev, ...page] : page);
                setNotificationsCursor(data.nextCursor || null);
                if (!append && activeTab !== 'notifications') {
                  setUnreadNotifsCount(page.filter(n => !n.read).length);
                }
              }
            } catch (e) {
              console.error(e);
            } finally {
              setNotificationsLoading(false);
            }
          };'''
          s = s[:start] + fn + s[end:]
          s = s.replace('      fetchNotifications();\n      fetchStories();', '      fetchNotifications({ cursor: null, append: false });\n      fetchStories();')
          s = s.replace('      fetchNotifications();\n      fetchProfile();', '      fetchNotifications({ cursor: null, append: false });\n      fetchProfile();')

          # Add a Load more control to the notifications case without disturbing its existing markup.
          case_start = s.index("      case 'notifications':")
          case_end = s.index("      case 'messages':", case_start)
          section = s[case_start:case_end]
          if 'notificationsCursor &&' not in section:
              marker = "\n        );"
              pos = section.rfind(marker)
              if pos < 0:
                  raise SystemExit('notifications render closing marker not found')
              addition = """
          {notificationsLoading && notifications.length > 0 && (
            <div style={{ textAlign: 'center', color: '#aaa', padding: '12px' }}>Loading...</div>
          )}
          {notificationsCursor && !notificationsLoading && (
            <div style={{ display: 'flex', justifyContent: 'center', padding: '16px 0' }}>
              <button
                onClick={() => fetchNotifications({ cursor: notificationsCursor, append: true })}
                style={{ background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '10px', color: '#fff', padding: '10px 18px', cursor: 'pointer' }}
              >
                Load more
              </button>
            </div>
          )}"""
              section = section[:pos] + addition + section[pos:]
              s = s[:case_start] + section + s[case_end:]
          p.write_text(s)
          PY

      - name: Verify
        run: |
          node --check server/index.js
          cd client
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-notification-pagination.yml
          git add server/index.js client/src/components/Dashboard.jsx
          git diff --cached --check
          git commit -m "feat: add cursor pagination for notifications"
          git push origin HEAD:feature/notifications-cursor-pagination
